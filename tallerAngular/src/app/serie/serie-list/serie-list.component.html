<div class="page-wrapper">
  <div class="top-bar">
    <span class="logo-box">TV</span>
    <span class="title">TV Series</span>
  </div>

  <div class="container-fluid mt-4">
    <div class="row">
      <div class="col-md-7">
        <table class="table table-striped table-hover">
          <thead>
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Channel</th>
              <th>Seasons</th>
            </tr>
          </thead>

          <tbody>
  <tr
    *ngFor="let serie of series; let i = index"
    class="serie-row"
    (click)="selectSerie(serie)"
  >
    <td>{{ i + 1 }}</td>
    <td>
      <a class="serie-name">{{ serie.name }}</a>
    </td>
    <td>{{ serie.channel }}</td>
    <td>{{ serie.seasons }}</td>
  </tr>
</tbody>
        </table>

        <p class="average-text">
          Seasons average: {{ seasonsAverage | number:'1.0-2' }}
        </p>
      </div>

      <div class="col-md-4 offset-md-1" *ngIf="selectedSerie">
        <div class="card serie-card">
          <img
            class="card-img-top"
            [src]="selectedSerie.poster"
            [alt]="selectedSerie.name"
          >

          <div class="card-body">
            <h5 class="card-title">
              <a
                [href]="selectedSerie.webpage"
                target="_blank"
                rel="noopener noreferrer"
                class="serie-link"
              >
                {{ selectedSerie.name }}
              </a>
            </h5>

            <p class="card-text">
              {{ selectedSerie.description }}
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
